name: Update index from haq-ki-awaz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy haq-ki-awaz.html to index.html
        run: cp haq-ki-awaz.html index.html
      - name: Commit and push index.html
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add index.html
          git commit -m "Replace index.html with updated haq-ki-awaz.html" || exit 0
          git push
