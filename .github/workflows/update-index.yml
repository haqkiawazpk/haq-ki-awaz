name: Copy haq-ki-awaz to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy file to index.html
        run: |
          cp haq-ki-awaz.html index.html
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add index.html
          git commit -m "Replace index.html with updated haq-ki-awaz.html" || echo "No changes to commit"
          git push
