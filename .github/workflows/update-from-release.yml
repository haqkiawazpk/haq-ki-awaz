name: Update index from release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://github.com/haqkiawazpk/haq-ki-awaz/releases/download/website-nov2026/haq-ki-awaz.html -o haq-ki-awaz.html
          test $(stat -c%s haq-ki-awaz.html) -gt 1000000 || { echo "download too small, aborting"; exit 1; }
          grep -q 'adiala-medical-checkup-imran-bushra-nov2026' haq-ki-awaz.html || { echo "missing adiala anchor, aborting"; exit 1; }
          grep -q 'trump-iran-strikes-unlikely-nov2026' haq-ki-awaz.html || { echo "missing trump anchor, aborting"; exit 1; }
          cp haq-ki-awaz.html index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "Update index.html from website-nov2026 release"
          git push
