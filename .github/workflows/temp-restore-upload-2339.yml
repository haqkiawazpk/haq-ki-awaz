name: Restore upload file
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore haq-ki-awaz-upload.html from 134f66c
        run: |
          git checkout 134f66c -- haq-ki-awaz-upload.html
          rm -f haq-ki-awaz-upload-test.html
          ls -lh haq-ki-awaz-upload.html haq-ki-awaz.html index.html
      - name: Commit restore
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add haq-ki-awaz-upload.html haq-ki-awaz-upload-test.html
          git diff --cached --quiet || git commit -m "Restore haq-ki-awaz-upload.html from 134f66c"
          git push
