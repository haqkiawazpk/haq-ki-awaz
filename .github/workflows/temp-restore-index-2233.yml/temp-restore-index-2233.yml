name: Temp restore index 2233
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous index into backup file and index.html
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git show 5b76ed6:index.html > haq-ki-awaz-before-2228-23nov2026.html
          git show 5b76ed6:index.html > index.html
          test -s haq-ki-awaz-before-2228-23nov2026.html
          test -s index.html
          git add haq-ki-awaz-before-2228-23nov2026.html index.html
          git diff --cached --quiet || git commit -m "Restore previous index.html content into haq-ki-awaz-before-2228-23nov2026.html and index.html"
          git push
