name: Temp update index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy updated export to index.html
        run: |
          cp haq-ki-awaz.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Replace index.html with updated haq-ki-awaz.html"
          git push
