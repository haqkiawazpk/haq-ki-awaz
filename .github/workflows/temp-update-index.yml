name: Temp Update Index
on:
  workflow_dispatch:
jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copy haq-ki-awaz.html to index.html
        run: |
          cp haq-ki-awaz.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html"
          else
            git commit -m "Replace index.html with updated haq-ki-awaz.html"
            git push
          fi
