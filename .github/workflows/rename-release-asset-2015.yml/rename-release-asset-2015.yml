name: Rename release asset before 2015 update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename haq-ki-awaz.html asset to backup name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/haqkiawazpk/haq-ki-awaz/releases/434577918/assets?per_page=100" | jq -r '.[] | select(.name=="haq-ki-awaz.html") | .id')
          echo "Current haq-ki-awaz.html asset id: $ASSET_ID"
          test -n "$ASSET_ID"
          curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"name":"haq-ki-awaz-before-2015-7nov2026.html"}' "https://api.github.com/repos/haqkiawazpk/haq-ki-awaz/releases/assets/$ASSET_ID"
          echo ""
          echo "Renamed. Verifying backup asset exists:"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/haqkiawazpk/haq-ki-awaz/releases/434577918/assets?per_page=100" | jq '.[] | select(.name=="haq-ki-awaz-before-2015-7nov2026.html") | {id, name, size}'
