name: Temp verify live 0815
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both live sites
        run: |
          set -e
          EXPECTED_SHA=962a9cd619abe7209efeebb343f293588c08b8649b1c07aec17dd546eb4ac923
          for URL in https://haqkiawazpk.github.io/haq-ki-awaz/ https://haqkiawazpk.github.io/; do
            echo "== $URL =="
            curl -fsSL --retry 3 --retry-delay 5 "$URL" -o live.html
            echo "bytes: $(wc -c < live.html)"
            echo "sha256: $(sha256sum live.html)"
            echo "articles: $(grep -o '<article' live.html | wc -l)"
            echo "first coalition line: $(grep -n 'coalition-electoral-reforms-nominees-nov2026' live.html | head -1)"
            echo "first us-iran line: $(grep -n 'us-iran-nuclear-reward-20m-nov2026' live.html | head -1)"
            echo "first karachi-uturn line: $(grep -n 'karachi-uturn-mayor-wahab-nov2026' live.html | head -1)"
            echo "fuel petrol: $(grep -o 'Rs 346' live.html | head -1)"
            echo "fuel diesel: $(grep -o 'Rs 378' live.html | head -1)"
            echo "self-post count: $(grep -c 'اپنی خبر خود لگائیں' live.html || true)"
            echo "muse count: $(grep -ci 'muse' live.html || true)"
            COALITION_LINE=$(grep -n 'coalition-electoral-reforms-nominees-nov2026' live.html | head -1 | cut -d: -f1)
            USIRAN_LINE=$(grep -n 'us-iran-nuclear-reward-20m-nov2026' live.html | head -1 | cut -d: -f1)
            echo "coalition_line=$COALITION_LINE usiran_line=$USIRAN_LINE"
            test "$COALITION_LINE" -lt "$USIRAN_LINE"
            test "$(sha256sum live.html | cut -d' ' -f1)" = "$EXPECTED_SHA"
            test "$(wc -c < live.html)" = "26815976"
            test "$(grep -o '<article' live.html | wc -l)" = "280"
            grep -q 'coalition-electoral-reforms-nominees-nov2026' live.html
            grep -q 'us-iran-nuclear-reward-20m-nov2026' live.html
            grep -q 'karachi-uturn-mayor-wahab-nov2026' live.html
            grep -q 'Rs 346' live.html
            grep -q 'Rs 378' live.html
            if grep -q 'اپنی خبر خود لگائیں' live.html; then echo "SELF-POST FOUND"; exit 1; fi
            echo "OK $URL"
          done
