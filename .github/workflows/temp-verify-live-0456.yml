name: Temp verify live 0921-9nov
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both live sites 200, 332 cards, new anchors first, no Muse header
        run: |
          set -e
          sleep 60
          for URL in "https://haqkiawazpk.github.io/haq-ki-awaz/" "https://haqkiawazpk.github.io/"; do
            echo "=== $URL ==="
            STATUS=$(curl -s -o live.html -w "%{http_code}" "$URL")
            echo "HTTP_STATUS=$STATUS"
            test "$STATUS" = "200"
            echo "SHA256:"; sha256sum live.html
            SHA=$(sha256sum live.html | cut -d' ' -f1)
            echo "SHA=$SHA"
            case "$SHA" in 92d53369*) ;; *) echo "SHA prefix mismatch"; exit 1;; esac
            echo "BYTES:"; wc -c live.html
            SIZE=$(stat -c %s live.html)
            echo "SIZE=$SIZE"
            test "$SIZE" -eq 24898348
            COUNT=$(grep -o '<article' live.html | wc -l)
            echo "ARTICLE_COUNT=$COUNT"
            test "$COUNT" -eq 332
            echo "FIRST_IDS:"; grep -o '<article[^>]*id="[^"]*"' live.html | head -4
            FIRST=$(grep -o '<article[^>]*id="[^"]*"' live.html | head -1)
            echo "FIRST_ID=$FIRST"
            echo "$FIRST" | grep -q 'muqam-malakand-taxes-nov2026'
            SECOND=$(grep -o '<article[^>]*id="[^"]*"' live.html | head -2 | tail -1)
            echo "SECOND_ID=$SECOND"
            echo "$SECOND" | grep -q 'hasina-passport-request-nov2026'
            for A in muqam-malakand-taxes-nov2026 hasina-passport-request-nov2026; do
              N=$(grep -o "id=\"$A\"" live.html | wc -l)
              echo "ANCHOR_ID $A COUNT=$N"
              test "$N" -eq 1
            done
            MUSE_COUNT=$(grep -o -i 'muse' live.html | wc -l)
            echo "MUSE_COUNT=$MUSE_COUNT"
            echo "MUSE_CONTEXTS:"; grep -o -i -E '.{0,40}muse.{0,40}' live.html | sort | uniq -c | sort -rn | head -20 || true
            HEADER_MUSE=$(grep -i -E 'generated by muse|created by muse|powered by muse|Muse AI|<!--[^-]*[Mm]use' live.html | wc -l)
            echo "MUSE_HEADER_PATTERNS=$HEADER_MUSE"
            test "$HEADER_MUSE" -eq 0
            FB=$(grep -o 'facebook.com/haq.ki.awaz.pakistan' live.html | wc -l)
            echo "FB_COUNT=$FB"
            test "$FB" -gt 0
          done
          echo "VERIFY_OK"
