name: Temp verify live 1930
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both live sites return 200, 302 cards, both anchors, Facebook follow links
        run: |
          set -e
          for URL in "https://haqkiawazpk.github.io/haq-ki-awaz/" "https://haqkiawazpk.github.io/"; do
            echo "=== $URL ==="
            STATUS=$(curl -s -o live.html -w "%{http_code}" "$URL")
            echo "HTTP_STATUS=$STATUS"
            test "$STATUS" = "200"
            echo "SHA256:"; sha256sum live.html
            echo "BYTES:"; wc -c live.html
            COUNT=$(grep -o '<article' live.html | wc -l)
            echo "ARTICLE_COUNT=$COUNT"
            test "$COUNT" -eq 302
            echo "FIRST_IDS:"; grep -o '<article[^>]*id="[^"]*"' live.html | head -4
            grep -q 'mashal-yousafzai-imran-release-nov2026' live.html || { echo "MASHAL_ANCHOR=missing"; exit 1; }
            echo "MASHAL_ANCHOR=present"
            grep -q 'krakow-mass-shooting-mourning-nov2026' live.html || { echo "KRAKOW_ANCHOR=missing"; exit 1; }
            echo "KRAKOW_ANCHOR=present"
            echo "FOLLOW:"; grep -o 'https://www.facebook.com/haq.ki.awaz.pakistan' live.html | wc -l
            FB=$(grep -o 'facebook.com/haq.ki.awaz.pakistan' live.html | wc -l)
            test "$FB" -gt 0
          done
