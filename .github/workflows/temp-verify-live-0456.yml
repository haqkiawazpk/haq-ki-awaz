name: Temp verify live 2051
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both live sites return 200, 304 cards, both anchors, Facebook follow links
        run: |
          set -e
          for URL in "https://haqkiawazpk.github.io/haq-ki-awaz/" "https://haqkiawazpk.github.io/"; do
            echo "=== $URL ==="
            STATUS=$(curl -s -o live.html -w "%{http_code}" "$URL")
            echo "HTTP_STATUS=$STATUS"
            test "$STATUS" = "200"
            echo "SHA256:"; sha256sum live.html
            echo "BYTES:"; wc -c live.html
            COUNT=$(grep -o '<article' live.html | wc -l)
            echo "ARTICLE_COUNT=$COUNT"
            test "$COUNT" -eq 304
            echo "FIRST_IDS:"; grep -o '<article[^>]*id="[^"]*"' live.html | head -4
            FIRST=$(grep -o '<article[^>]*id="[^"]*"' live.html | head -1)
            echo "FIRST_ID=$FIRST"
            echo "$FIRST" | grep -q 'shehbaz-nawaz-jati-umra-nov2026'
            SECOND=$(grep -o '<article[^>]*id="[^"]*"' live.html | head -2 | tail -1)
            echo "SECOND_ID=$SECOND"
            echo "$SECOND" | grep -q 'iran-hormuz-qeshm-blasts-nov2026'
            grep -q 'shehbaz-nawaz-jati-umra-nov2026' live.html || { echo "SHEHBAZ_ANCHOR=missing"; exit 1; }
            echo "SHEHBAZ_ANCHOR=present"
            grep -q 'iran-hormuz-qeshm-blasts-nov2026' live.html || { echo "HORMUZ_ANCHOR=missing"; exit 1; }
            echo "HORMUZ_ANCHOR=present"
            MUSE_COUNT=$(grep -o -i 'muse' live.html | wc -l)
            echo "MUSE_COUNT=$MUSE_COUNT"
            echo "MUSE_CONTEXTS:"; grep -o -i -E '.{0,40}muse.{0,40}' live.html | sort | uniq -c | sort -rn | head -40
            HEADER_MUSE=$(grep -i -E 'generated by muse|created by muse|powered by muse|Muse AI|<!--[^>]*[Mm]use' live.html | wc -l)
            echo "MUSE_HEADER_PATTERNS=$HEADER_MUSE"
            test "$HEADER_MUSE" -eq 0
            echo "FOLLOW:"; grep -o 'https://www.facebook.com/haq.ki.awaz.pakistan' live.html | wc -l
            FB=$(grep -o 'facebook.com/haq.ki.awaz.pakistan' live.html | wc -l)
            test "$FB" -gt 0
          done
