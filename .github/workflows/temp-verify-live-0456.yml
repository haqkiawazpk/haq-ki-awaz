name: Temp verify live 1015
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify project Pages URL
        run: |
          URL="https://haqkiawazpk.github.io/haq-ki-awaz/"
          curl -fsSL "$URL" -o live.html
          echo "SHA256:"; sha256sum live.html
          echo "BYTES:"; wc -c live.html
          echo "ARTICLES:"; grep -o '<article' live.html | wc -l
          echo "FIRST_IDS:"; grep -o '<article[^>]*id="[^"]*"' live.html | head -4
          echo "FIRST_ANCHORS:"; grep -o 'href="/[^"]*-nov2026/"' live.html | head -2
          echo "HREF_NOV2026:"; grep -o 'href="[^"]*nov2026[^"]*"' live.html | head -4
          echo "FOLLOW:"; grep -o 'https://www.facebook.com/haq.ki.awaz.pakistan' live.html | wc -l
          echo "FUEL_RS346:"; grep -o 'Rs346' live.html | wc -l
          echo "FUEL_RS378:"; grep -o 'Rs378' live.html | wc -l
          echo "SELFPOST_1015:"; grep -o 'haq-ki-awaz-before-1015-8nov2026.html' live.html | wc -l
          echo "EXPECTED_SHA=f018a0220f9325616f54cb9ccdcc9584010e9268e33cc9ee4458fbe395fa7829"
          echo "EXPECTED_BYTES=28450969"
          echo "EXPECTED_ARTICLES=284"
          echo "EXPECTED_FOLLOW=285"
          echo "EXPECTED_FIRST1=href=\"/sc-acquits-brothers-blasphemy-20-years-nov2026/\""
          echo "EXPECTED_FIRST2=href=\"/uae-rescues-22-crew-oman-ship-fire-nov2026/\""
