name: Temp verify live 1851
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both live sites return 200, 300 cards, both anchors, Facebook follow links
        run: |
          set -e
          for URL in "https://haqkiawazpk.github.io/haq-ki-awaz/" "https://haqkiawazpk.github.io/"; do
            echo "=== $URL ==="
            STATUS=$(curl -s -o live.html -w "%{http_code}" "$URL")
            echo "HTTP_STATUS=$STATUS"
            test "$STATUS" = "200"
            echo "SHA256:"; sha256sum live.html
            echo "BYTES:"; wc -c live.html
            COUNT=$(grep -o '<article' live.html | wc -l)
            echo "ARTICLE_COUNT=$COUNT"
            test "$COUNT" -eq 300
            echo "FIRST_IDS:"; grep -o '<article[^>]*id="[^"]*"' live.html | head -4
            grep -q 'khawaja-asif-new-provinces-12-nov2026' live.html || { echo "KHAWAJA_ANCHOR=missing"; exit 1; }
            echo "KHAWAJA_ANCHOR=present"
            grep -q 'remembrance-sunday-cenotaph-king-nov2026' live.html || { echo "REMEMBRANCE_ANCHOR=missing"; exit 1; }
            echo "REMEMBRANCE_ANCHOR=present"
            echo "FOLLOW:"; grep -o 'https://www.facebook.com/haq.ki.awaz.pakistan' live.html | wc -l
            FB=$(grep -o 'facebook.com/haq.ki.awaz.pakistan' live.html | wc -l)
            test "$FB" -gt 0
          done
