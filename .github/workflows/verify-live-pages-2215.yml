name: Verify live Pages 2215
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both live Pages addresses
        run: |
          set -e
          EXPECTED="6986badbd1946674e2cac67083baae7a9aa2870de6895b36f4d39aa3f8decb76"
          for URL in "https://haqkiawazpk.github.io/haq-ki-awaz/" "https://haqkiawazpk.github.io/"; do
            echo "=== $URL ==="
            curl -s -o page.html -w "HTTP %{http_code} size %{size_download}\n" "$URL"
            ls -l page.html
            sha256sum page.html
            ACTUAL=$(sha256sum page.html | awk '{print $1}')
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            if [ "$ACTUAL" = "$EXPECTED" ]; then echo "SHA256 MATCHES EXPECTED for $URL"; else echo "SHA256 MISMATCH for $URL"; exit 1; fi
            echo "First two article tags:"
            grep -n '<article' page.html | head -2 | cut -c1-220
            echo "Article tags: $(grep -o '<article' page.html | wc -l)"
            echo "Self-post phrase count: $(grep -o 'اپنی خبر خود لگائیں' page.html | wc -l)"
            echo "Fuel Rs346 count: $(grep -o 'Rs 346' page.html | wc -l)"
            echo "Fuel Rs378 count: $(grep -o 'Rs 378' page.html | wc -l)"
          done
