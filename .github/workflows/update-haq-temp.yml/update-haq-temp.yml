name: Update haq from release (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download website-nov2026 --repo haqkiawazpk/haq-ki-awaz --pattern "haq-ki-awaz.html" --dir /tmp
          cp /tmp/haq-ki-awaz.html haq-ki-awaz.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add haq-ki-awaz.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update haq-ki-awaz.html from website-nov2026 release"
            git push
          fi
