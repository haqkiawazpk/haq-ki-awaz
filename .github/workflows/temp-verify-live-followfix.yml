name: Temp verify live followfix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check both live Pages sites
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, hashlib
          from html.parser import HTMLParser
          from collections import Counter
          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]; self.cur=None
              def handle_starttag(self, tag, attrs):
                  if tag=='a':
                      d=dict(attrs)
                      self.cur={'href': d.get('href',''), 'text': ''}
                      self.links.append(self.cur)
              def handle_data(self, data):
                  if self.cur is not None:
                      self.cur['text']+=data
              def handle_endtag(self, tag):
                  if tag=='a':
                      self.cur=None
          for url in ['https://haqkiawazpk.github.io/haq-ki-awaz/', 'https://haqkiawazpk.github.io/']:
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req) as r:
                  status=r.getcode()
                  data=r.read()
              html=data.decode('utf-8','ignore')
              print('URL:', url, 'HTTP', status, 'bytes', len(data), 'sha256', hashlib.sha256(data).hexdigest())
              p=P(); p.feed(html)
              follow=[l for l in p.links if 'follow' in l['text'].lower() or 'فالو' in l['text']]
              print('total links:', len(p.links), 'follow links:', len(follow))
              print('follow href counts:', dict(Counter(l['href'] for l in follow)))
              print('raw new occurrences:', html.count('facebook.com/haq.ki.awaz.pakistan'), 'raw old occurrences:', html.count('facebook.com/61595962084268'))
              like=[l for l in p.links if 'like' in l['text'].lower() or 'لائک' in l['text']]
              print('like links:', len(like), 'like href counts:', dict(Counter(l['href'] for l in like)))
              assert status==200, status
              assert len(follow)==263, f"follow count {len(follow)}"
              assert all(l['href']=='https://www.facebook.com/haq.ki.awaz.pakistan' for l in follow), 'follow href mismatch'
              print('OK follow buttons all new, none old')
          print('BOTH LIVE SITES VERIFIED')
          PY
