name: Temp verify live followfix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check both live Pages sites and raw files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, hashlib
          from html.parser import HTMLParser
          from collections import Counter
          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]; self.cur=None
              def handle_starttag(self, tag, attrs):
                  if tag=='a':
                      d=dict(attrs)
                      self.cur={'href': d.get('href',''), 'text': ''}
                      self.links.append(self.cur)
              def handle_data(self, data):
                  if self.cur is not None:
                      self.cur['text']+=data
              def handle_endtag(self, tag):
                  if tag=='a':
                      self.cur=None
          EXPECT='0aa950dca13d60df2f2e9699b1dcb9c07e06742a91ce7572acfec8f0ff613573'
          urls=[
            ('pages-project', 'https://haqkiawazpk.github.io/haq-ki-awaz/'),
            ('pages-root', 'https://haqkiawazpk.github.io/'),
            ('raw-project-haq', 'https://raw.githubusercontent.com/haqkiawazpk/haq-ki-awaz/main/haq-ki-awaz.html'),
            ('raw-root-index', 'https://raw.githubusercontent.com/haqkiawazpk/haqkiawazpk.github.io/main/index.html'),
          ]
          for label, url in urls:
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req) as r:
                  status=r.getcode()
                  data=r.read()
              html=data.decode('utf-8','ignore')
              sha=hashlib.sha256(data).hexdigest()
              print('---', label, url, 'HTTP', status, 'bytes', len(data), 'sha256', sha, 'sha_matches_expected', sha==EXPECT)
              p=P(); p.feed(html)
              follow=[l for l in p.links if 'follow' in l['text'].lower() or 'فالو' in l['text']]
              print('total links:', len(p.links), 'follow links:', len(follow))
              print('follow href counts:', dict(Counter(l['href'] for l in follow)))
              print('raw new occurrences:', html.count('facebook.com/haq.ki.awaz.pakistan'), 'raw old occurrences:', html.count('facebook.com/61595962084268'))
          print('CHECK DONE - see sha_matches_expected and follow counts above')
          PY
