name: Temp verify live catchup5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check both live Pages sites and raw files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, hashlib, re
          from html.parser import HTMLParser
          from collections import Counter
          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]
                  self.cur=None
              def handle_starttag(self, tag, attrs):
                  if tag=='a':
                      d=dict(attrs)
                      self.cur={'href': d.get('href',''), 'text': ''}
                      self.links.append(self.cur)
              def handle_data(self, data):
                  if self.cur is not None:
                      self.cur['text']+=data
              def handle_endtag(self, tag):
                  if tag=='a':
                      self.cur=None
          EXPECT='9fa5749dd6a95082a8eee2698e6f7fe55d3146a7554d74611d3d5ea3c1313a85'
          FB='https://www.facebook.com/haq.ki.awaz.pakistan'
          urls=[
            ('pages-project', 'https://haqkiawazpk.github.io/haq-ki-awaz/'),
            ('pages-root', 'https://haqkiawazpk.github.io/'),
            ('raw-project-haq', 'https://raw.githubusercontent.com/haqkiawazpk/haq-ki-awaz/main/haq-ki-awaz.html'),
            ('raw-root-index', 'https://raw.githubusercontent.com/haqkiawazpk/haqkiawazpk.github.io/main/index.html'),
          ]
          for label, url in urls:
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req) as r:
                  status=r.getcode()
                  data=r.read()
              html=data.decode('utf-8','ignore')
              sha=hashlib.sha256(data).hexdigest()
              print('---', label, url, 'HTTP', status, 'bytes', len(data), 'sha256', sha, 'sha_matches_expected', sha==EXPECT)
              p=P(); p.feed(html)
              fb=[l for l in p.links if l['href']==FB]
              allfb=[l for l in p.links if 'facebook.com' in l['href']]
              follow=[l for l in p.links if 'follow' in l['text'].lower()]
              print('total links:', len(p.links), 'fb links:', len(fb), 'all facebook links:', len(allfb), 'follow-text links:', len(follow))
              print('follow href counts:', dict(Counter([l['href'] for l in follow])))
              print('articles:', html.count('<article'), 'new_card:', html.count('karachi-uturn-mayor-wahab-nov2026'), 'selfpost:', html.count('اپنی خبر خود لگائیں'), 'muse:', html.lower().count('muse'))
              otherfb=[l['href'] for l in allfb if l['href']!=FB and not l['href'].startswith(FB+'/')]
              print('other fb links:', len(otherfb), 'sample:', otherfb[:5])
              print('muse contexts:', [html[max(0, m.start()-40):m.start()+40].replace(chr(10), ' ') for m in list(re.finditer('muse', html, flags=re.I))[:5]])
              assert status==200, label
              assert sha==EXPECT, label
              assert html.count('<article')==270, label
              assert html.count('karachi-uturn-mayor-wahab-nov2026')>=1, label
              assert html.count('اپنی خبر خود لگائیں')==0, label
              assert len(fb)==271, label
              assert all(l['href']==FB for l in follow), label
          print('CHECK DONE - both live sites verified')
          PY
