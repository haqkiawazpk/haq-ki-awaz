name: Temp verify release asset catchup5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify release asset
        run: |
          set -e
          set -x
          curl -sL -o /tmp/haq.html https://github.com/haqkiawazpk/haq-ki-awaz/releases/download/website-nov2026/haq-ki-awaz.html
          echo "bytes=$(wc -c < /tmp/haq.html)"
          echo "sha256=$(sha256sum /tmp/haq.html | cut -d ' ' -f1)"
          echo "articles=$(grep -o '<article' /tmp/haq.html | wc -l)"
          echo "follow_links=$(grep -o 'https://www.facebook.com/haq.ki.awaz.pakistan' /tmp/haq.html | wc -l)"
          echo "selfpost_count=$(grep -o 'اپنی خبر خود لگائیں' /tmp/haq.html | wc -l)"
          echo "new_card=$(grep -c 'karachi-uturn-mayor-wahab-nov2026' /tmp/haq.html)"
          echo "new_card_context=$(grep -o '.\{0,80\}karachi-uturn-mayor-wahab-nov2026.\{0,80\}' /tmp/haq.html | head -1)"
          echo "other_fb_links=$(grep -o 'https://www.facebook.com/[^"]*' /tmp/haq.html | grep -v 'https://www.facebook.com/haq.ki.awaz.pakistan' | wc -l)"
          FIRST7=$(python3 - <<'PY'
          import re
          h=open('/tmp/haq.html', encoding='utf-8', errors='ignore').read()
          ids=re.findall(r'<article[^>]*?id=["\']([^"\']+)["\']', h, flags=re.S)
          print(' '.join(ids[:7]))
          PY
          )
          echo "first7=$FIRST7"
          test "$(wc -c < /tmp/haq.html)" = "21734027"
          test "$(sha256sum /tmp/haq.html | cut -d ' ' -f1)" = "9fa5749dd6a95082a8eee2698e6f7fe55d3146a7554d74611d3d5ea3c1313a85"
          test "$(grep -o '<article' /tmp/haq.html | wc -l)" = "270"
          test "$(grep -o 'https://www.facebook.com/haq.ki.awaz.pakistan' /tmp/haq.html | wc -l)" = "271"
          test "$(grep -o 'اپنی خبر خود لگائیں' /tmp/haq.html | wc -l)" = "0"
          grep -q 'karachi-uturn-mayor-wahab-nov2026' /tmp/haq.html
          grep -q '<article class="card" id="karachi-uturn-mayor-wahab-nov2026"' /tmp/haq.html
          test "$FIRST7" = "peshawar-encroachment-school-video-nov2026 punjab-cart-vendor-video-nov2026 gcc-railway-agreement-nov2026 ecp-lg-nominations-extended-nov2026 karachi-sohrab-goth-fire-video-nov2026 swat-lake-remains-nov2026 bangladesh-garment-protest-video-nov2026"
          grep -q 'Rs346' /tmp/haq.html
          grep -q 'Rs378' /tmp/haq.html
          echo VERIFIED
