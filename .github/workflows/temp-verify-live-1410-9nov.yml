name: Temp verify live 1410-9nov
on:
  workflow_dispatch:
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both live sites
        run: |
          for URL in "https://haqkiawazpk.github.io/" "https://haqkiawazpk.github.io/haq-ki-awaz/"; do
            echo "===== $URL ====="
            curl -sL -o /tmp/live.html -w "HTTP_CODE=%{http_code} DOWNLOAD_BYTES=%{size_download}\n" "$URL"
            echo "FILE_BYTES=$(wc -c < /tmp/live.html)"
            echo "SHA256=$(sha256sum /tmp/live.html | cut -d' ' -f1)"
            echo "ARTICLES=$(grep -o '<article' /tmp/live.html | wc -l)"
            echo "PM_ANCHOR=$(grep -o 'pm-shehbaz-gaza-aid-escalate-nov2026' /tmp/live.html | wc -l)"
            echo "MAINE_ANCHOR=$(grep -o 'maine-ranked-choice-tabulation-nov2026' /tmp/live.html | wc -l)"
            echo "PM_FIRST_LINE=$(grep -n 'pm-shehbaz-gaza-aid-escalate-nov2026' /tmp/live.html | head -1 | cut -d: -f1)"
            echo "MAINE_FIRST_LINE=$(grep -n 'maine-ranked-choice-tabulation-nov2026' /tmp/live.html | head -1 | cut -d: -f1)"
            echo "FIRST_ARTICLE_IDS:"
            grep -o 'id="[^"]*nov2026"' /tmp/live.html | head -5
            echo "PETROL_RS346=$(grep -o 'Rs 346' /tmp/live.html | wc -l)"
            echo "DIESEL_RS378=$(grep -o 'Rs 378' /tmp/live.html | wc -l)"
            echo "SELFPOST_COUNT=$(grep -o 'اپنی خبر خود لگائیں' /tmp/live.html | wc -l)"
            echo "MUSE_COUNT=$(grep -oi 'muse' /tmp/live.html | wc -l)"
            echo "EXPECTED: bytes=25438447 sha=074f7f87f00659b17f7cc8d55e8285d8e86ab3edda28effd7a8e4075c0343fcc articles=340 pm=1 maine=1 petrol>=1 diesel>=1 selfpost=0 muse=0"
          done
