name: Temp update haq 2115
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download haq-ki-awaz.html from release and commit
        run: |
          set -e
          curl -fL -o haq-ki-awaz.html https://github.com/haqkiawazpk/haq-ki-awaz/releases/download/website-nov2026/haq-ki-awaz.html
          test -s haq-ki-awaz.html
          SIZE=$(stat -c%s haq-ki-awaz.html)
          echo "SIZE=$SIZE"
          test "$SIZE" -gt 1000000
          grep -q 'kp-faceless-atcs-terror-trials-nov2026' haq-ki-awaz.html
          grep -q 'europeans-join-ukraine-talks-abu-dhabi-nov2026' haq-ki-awaz.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add haq-ki-awaz.html
          git diff --cached --quiet || git commit -m "Update haq-ki-awaz.html from website-nov2026 release - 8 Nov 2026"
          git push
