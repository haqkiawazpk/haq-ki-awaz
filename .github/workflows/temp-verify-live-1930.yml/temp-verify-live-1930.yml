name: Temp verify live 1930
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for URL in https://haqkiawazpk.github.io/haq-ki-awaz/ https://haqkiawazpk.github.io/; do
            echo "===== $URL ====="
            curl -fsSL "$URL" -o live.html
            echo "size_bytes=$(stat -c%s live.html)"
            sha256sum live.html
            echo "expected_sha256=f0d842a26c07a03085c953ce3c30673793183f3069f01ef2790f88ff3e9247ad"
            echo "expected_size=26896488"
            echo "id_kp=$(grep -o 'id="kp-gold-mining-jit-probe-nov2026"' live.html | wc -l)"
            echo "id_gaza=$(grep -o 'id="gaza-four-killed-deir-balah-khan-younis-nov2026"' live.html | wc -l)"
            echo "text_kp=$(grep -o 'kp-gold-mining-jit-probe-nov2026' live.html | wc -l)"
            echo "text_gaza=$(grep -o 'gaza-four-killed-deir-balah-khan-younis-nov2026' live.html | wc -l)"
            echo "article_tags=$(grep -o '<article' live.html | wc -l)"
            echo "muse_mentions=$(grep -i -o 'Muse' live.html | wc -l)"
          done
