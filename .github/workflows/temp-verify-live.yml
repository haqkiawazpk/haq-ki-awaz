name: Temp verify live pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both live pages
        run: |
          set -e
          cat > /tmp/check.py << 'PY'
          import hashlib, re, urllib.request
          expected = "ef28fd3a12699db43504ab9f684d3a0188c3ba797d6c812dbe208251a5c8d04b"
          urls = ["https://haqkiawazpk.github.io/haq-ki-awaz/", "https://haqkiawazpk.github.io/"]
          for url in urls:
              print("=== " + url + " ===", flush=True)
              resp = urllib.request.urlopen(url, timeout=60)
              print("status:", resp.status, flush=True)
              data = resp.read()
              print("bytes:", len(data), flush=True)
              print("sha256:", hashlib.sha256(data).hexdigest(), flush=True)
              assert hashlib.sha256(data).hexdigest() == expected, "sha256 mismatch"
              text = data.decode("utf-8", errors="ignore")
              articles = re.findall(r"<article\b[^>]*>", text)
              print("article tags:", len(articles), flush=True)
              print("first 5 article tags:", articles[:5], flush=True)
              assert len(articles) == 260, "article count is not 260"
              assert "govt-auto-policy-ev-nov2026" in articles[0], "first article mismatch"
              assert "russia-us-ukraine-abu-dhabi-delegation-nov2026" in articles[1], "second article mismatch"
              assert "Rs346" in text, "petrol Rs346 not found"
              assert "Rs378" in text, "diesel Rs378 not found"
              assert "اپنی خبر خود لگائیں" not in text, "self-post section present"
              muse_matches = list(re.finditer("Muse", text))
              print("Muse count:", len(muse_matches), flush=True)
              for m in muse_matches[:10]:
                  print("Muse context:", repr(text[max(0, m.start()-120):m.start()+120]), flush=True)
              headers = re.findall(r"<header\b[^>]*>.*?</header>", text, flags=re.S)
              print("header blocks:", len(headers), flush=True)
              print("Muse in any header:", any("Muse" in h for h in headers), flush=True)
              print("Muse in first 3000 chars:", "Muse" in text[:3000], flush=True)
              print("OK " + url, flush=True)
          print("ALL LIVE CHECKS PASSED", flush=True)
          PY
          python3 /tmp/check.py
