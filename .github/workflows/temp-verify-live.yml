name: Temp verify live pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both live pages
        run: |
          set -e
          cat > /tmp/check.py << 'PY'
          import hashlib, re, urllib.request
          expected = "37cb01b2e4d1fa1ba4692e5d9126686fa08d31c24f1a2d14c14412a340ecbf63"
          urls = ["https://haqkiawazpk.github.io/haq-ki-awaz/", "https://haqkiawazpk.github.io/"]
          for url in urls:
            print("=== " + url + " ===", flush=True)
            data = urllib.request.urlopen(url, timeout=60).read()
            print("bytes:", len(data), flush=True)
            print("sha256:", hashlib.sha256(data).hexdigest(), flush=True)
            assert hashlib.sha256(data).hexdigest() == expected, "sha256 mismatch"
            text = data.decode("utf-8", errors="ignore")
            articles = re.findall(r"<article\b[^>]*>", text)
            print("article tags:", len(articles), flush=True)
            print("first 5 article tags:", articles[:5], flush=True)
            assert len(articles) == 258, "article count is not 258"
            assert "cda-madrassa-notices-fazl-nov2026" in articles[0], "first article mismatch"
            assert "hormuz-tanker-mine-fire-nov2026" in articles[1], "second article mismatch"
            assert "Rs346" in text, "petrol Rs346 not found"
            assert "Rs378" in text, "diesel Rs378 not found"
            assert "اپنی خبر خود لگائیں" not in text, "self-post section present"
            assert "Muse" not in text, "Muse text present"
            print("OK " + url, flush=True)
          print("ALL LIVE CHECKS PASSED", flush=True)
          PY
          python3 /tmp/check.py
